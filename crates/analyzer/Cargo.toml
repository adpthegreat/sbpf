[package]
name = "sbpf-analyzer"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "CFG and DFG analyzer and visualiser for SBPF assembly programs"
keywords = ["solana", "bpf", "analyzer", "blockchain"]
categories = ["development-tools", "compilers"]
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "lib"]
name = "sbpf_analyzer"

[dependencies]
either = { workspace = true }
num-traits = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
sbpf-common = { workspace = true }
sbpf-syscall-map = { workspace = true }
sbpf-disassembler = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = { version = "0.2.92", features = ["serde-serialize"] }
serde-wasm-bindgen = "0.6.5"
serde = { version = "1.0.219", features = ["derive"] }

[dev-dependencies]
blake3 = "1"
toml = "0.8"
serde = { version = "1.0.219", features = ["derive"] }
object = { workspace = true }
